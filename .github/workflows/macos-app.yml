name: macOS app

# Builds a double-clickable Spektrafilm.app for Intel and Apple Silicon.
# macos-13 (Intel) was removed in December 2025; macos-15-intel is the
# native x86_64 hosted runner. macos-15 is Apple Silicon.

on:
  push:
    branches:
      - main
      - 'cursor/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Spektrafilm.app
        run: bash packaging/macos/build_app.sh

      - name: Zip the app
        run: |
          set -euo pipefail
          ARCHIVE="dist/Spektrafilm-macos-${{ matrix.arch }}.zip"
          ditto -c -k --keepParent dist/Spektrafilm.app "$ARCHIVE"
          ls -lh "$ARCHIVE"
          {
            echo "### Spektrafilm macOS ${{ matrix.arch }}"
            echo ""
            echo '```'
            ls -lh "$ARCHIVE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload UI preview
        if: hashFiles('dist/preview/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: spektrafilm-ui-preview-${{ matrix.arch }}
          path: dist/preview/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: spektrafilm-macos-${{ matrix.arch }}
          path: dist/Spektrafilm-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download app archives
        uses: actions/download-artifact@v4
        with:
          pattern: spektrafilm-macos-*
          merge-multiple: true
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no zip archives to attach" >&2
            exit 1
          fi
          ls -lh "${files[@]}"
          notes=$(printf '%s\n' \
            'macOS 版 Spektrafilm 桌面应用。' \
            '' \
            '- 新增应用图标（胶片画格与光谱）。' \
            '- 界面支持简体中文。系统语言为中文时默认使用简体中文，也可用环境变量 SPEKTRAFILM_LANG=zh_CN 或 en 切换。napari 自身菜单仍为英文，因为没有随 napari 0.6 发布的官方简体中文语言包。' \
            '- 需要 macOS 14 或更高版本。' \
            '- 应用未经 Apple 公证。首次打开请在终端执行：' \
            '' \
            '    xattr -cr /Applications/Spektrafilm.app' \
            '' \
            '  或在「系统设置 > 隐私与安全性」中选择「仍要打开」。' \
            '' \
            '- Spektrafilm-macos-arm64.zip：Apple 芯片' \
            '- Spektrafilm-macos-x86_64.zip：Intel' \
            '' \
            '第一次启动会改写安装路径、重新签名，并编译 Numba 内核，所以会比之后的启动慢。请先把 Spektrafilm.app 放到最终位置再打开。')
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "$GITHUB_REF_NAME" \
              --notes "$notes"
          fi
