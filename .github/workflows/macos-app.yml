name: Desktop app

# macOS (Intel + Apple Silicon), Windows x64, and Linux x86_64 bundles.
# macos-13 was removed in December 2025; Intel macOS uses macos-15-intel.

on:
  push:
    branches:
      - main
      - 'cursor/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Spektrafilm.app
        run: bash packaging/macos/build_app.sh

      - name: Zip the app
        run: |
          set -euo pipefail
          ARCHIVE="dist/Spektrafilm-macos-${{ matrix.arch }}.zip"
          ditto -c -k --keepParent dist/Spektrafilm.app "$ARCHIVE"
          ls -lh "$ARCHIVE"
          {
            echo "### Spektrafilm macOS ${{ matrix.arch }}"
            echo ""
            echo '```'
            ls -lh "$ARCHIVE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload UI preview
        if: hashFiles('dist/preview/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: spektrafilm-ui-preview-${{ matrix.arch }}
          path: dist/preview/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: spektrafilm-macos-${{ matrix.arch }}
          path: dist/Spektrafilm-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-windows:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Windows app
        shell: pwsh
        run: ./packaging/windows/build_app.ps1

      - name: Upload Windows archives
        uses: actions/upload-artifact@v4
        with:
          name: spektrafilm-windows-x64
          path: |
            dist/Spektrafilm-windows-x64.zip
            dist/Spektrafilm-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-linux:
    name: linux-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Linux app
        run: bash packaging/linux/build_app.sh

      - name: Upload Linux archives
        uses: actions/upload-artifact@v4
        with:
          name: spektrafilm-linux-x86_64
          path: |
            dist/Spektrafilm-linux-x86_64.tar.gz
            dist/Spektrafilm-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: GitHub Release
    needs: [build, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download macOS archives
        uses: actions/download-artifact@v4
        with:
          pattern: spektrafilm-macos-*
          merge-multiple: true
          path: dist

      - name: Download Windows archives
        uses: actions/download-artifact@v4
        with:
          pattern: spektrafilm-windows-*
          merge-multiple: true
          path: dist

      - name: Download Linux archives
        uses: actions/download-artifact@v4
        with:
          pattern: spektrafilm-linux-*
          merge-multiple: true
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.zip dist/*.tar.gz dist/*.AppImage dist/*.exe)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no release archives to attach" >&2
            exit 1
          fi
          ls -lh "${files[@]}"
          notes=$(printf '%s\n' \
            'Spektrafilm 桌面版：macOS、Windows、Linux。' \
            '' \
            '- 界面支持 English、简体中文、繁體中文。可在「介面參數 / GUI parameters」里的语言菜单切换，选择会保存，下次启动仍然有效。环境变量 SPEKTRAFILM_LANG 优先于已保存的选择，其次才是系统语言。zh_TW、zh_HK、zh_Hant 使用繁體中文；zh_CN、zh_Hans 使用简体中文。' \
            '- napari 自身菜单仍为英文：napari 0.6 没有随附的官方中文语言包。' \
            '- macOS 需要 14 或更高版本，应用未经公证。首次打开请执行：' \
            '' \
            '    xattr -cr /Applications/Spektrafilm.app' \
            '' \
            '  或在「系统设置 > 隐私与安全性」中选择「仍要打开」。' \
            '- Windows 安装包和程序未签名。SmartScreen 提示时选「更多信息」>「仍要运行」。' \
            '- Linux 提供 PyInstaller 目录的 tar.gz，以及 AppImage。两者都带上了 Qt 需要的 libEGL、libGL 和 xcb 库，以及思源黑体（Noto CJK），简体和繁体中文不会显示成方框。如果仍提示缺库或中文是方框，安装：sudo apt install libegl1 libgl1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xkb1 libxkbcommon-x11-0 fonts-noto-cjk' \
            '- Ctrl+Q（macOS 为 Cmd+Q）或关闭窗口会退出程序。' \
            '' \
            '- Spektrafilm-macos-arm64.zip：Apple 芯片' \
            '- Spektrafilm-macos-x86_64.zip：Intel Mac' \
            '- Spektrafilm-windows-x64.zip / Spektrafilm-windows-x64-setup.exe：Windows x64' \
            '- Spektrafilm-linux-x86_64.tar.gz / Spektrafilm-linux-x86_64.AppImage：Linux x86_64' \
            '' \
            '第一次启动会编译 Numba 内核，所以会比之后的启动慢。')
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "$GITHUB_REF_NAME" \
              --notes "$notes"
          fi
